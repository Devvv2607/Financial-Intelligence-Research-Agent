[project]
name = "fira-evals"
version = "0.1.0"
description = "Zero-token and live evaluation harness for FIRA"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.12",
    "pyyaml>=6.0.3",
    "types-PyYAML>=6.0.12.20250915",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evals"]
