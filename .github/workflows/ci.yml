name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: fira
      POSTGRES_PASSWORD: fira
      POSTGRES_DB: fira
      DATABASE_URL: postgresql+psycopg://fira:fira@localhost:5442/fira
    services:
      postgres:
        image: postgres:18.6-alpine
        ports:
          - 5442:5432
        env:
          POSTGRES_USER: fira
          POSTGRES_PASSWORD: fira
          POSTGRES_DB: fira
        options: >-
          --health-cmd "pg_isready -U fira -d fira"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # this action publishes no moving major tags
        with:
          version: "0.13.7"
          enable-cache: true
      - run: uv sync --frozen
      - run: make lint
      - run: make typecheck
      - run: uv run alembic -c backend/alembic.ini upgrade head
      # Live tests (real Groq/SEC/NewsAPI) are excluded by default via `-m 'not live'`.
      - run: make test

  frontend:
    name: Frontend (eslint, tsc, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: make web-check
      - run: npm --prefix frontend run build

  contracts:
    name: API contracts and generated types up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen
      - run: npm --prefix frontend ci
      # Fails if a backend schema changed without `make contracts` being run and committed.
      - run: make contracts-check

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend, contracts]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - run: docker compose build
