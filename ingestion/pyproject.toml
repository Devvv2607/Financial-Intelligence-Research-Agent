[project]
name = "fira-ingestion"
version = "0.1.0"
description = "SEC EDGAR + NewsAPI ingestion pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fira-backend",
    "lxml>=6.1.3",
    "rich>=15.0.0",
    "numpy>=2.5.4",
]

[tool.uv.sources]
fira-backend = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]
