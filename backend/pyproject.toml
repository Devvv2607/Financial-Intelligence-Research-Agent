[project]
name = "fira-backend"
version = "0.1.0"
description = "Shared core, LangGraph agent and FastAPI service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.12",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.8",
    "psycopg[binary]>=3.3.7",
    "weaviate-client>=4.24.1",
    "httpx>=0.28.1",
    "alembic>=1.20.1",
    "fastembed>=0.9.1",
    "tokenizers>=0.23.3",
    "numpy>=2.5.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/api"]
