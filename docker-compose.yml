# One command brings up the whole stack:  docker compose up -d --build
# Host ports (override in .env): web 3000, api 8000, postgres 5442, weaviate 8095 (HTTP) + 50055 (gRPC).
# Postgres/Weaviate use uncommon host ports so they don't collide with native Postgres
# installs or other projects' Weaviate (and host-run code can't hit the wrong database).

name: fira

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fira}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fira}
      POSTGRES_DB: ${POSTGRES_DB:-fira}
    ports: ["${POSTGRES_HOST_PORT:-5442}:5432"]
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/ — mount the
      # parent, not the old /var/lib/postgresql/data path.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.40.3
    command: ["--host", "0.0.0.0", "--port", "8080", "--scheme", "http"]
    environment:
      # We bring our own vectors (fastembed): no vectorizer modules. Collections declare
      # `vectorizer: none` themselves (DEFAULT_VECTORIZER_MODULE is ignored since v1.40).
      ENABLE_MODULES: ""
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      LOG_LEVEL: info
      CLUSTER_HOSTNAME: node1
      # Single node: advertise loopback explicitly. Auto-detection fails under Docker
      # Desktop/WSL2 ("no private IP address found") and Weaviate exits on startup.
      CLUSTER_ADVERTISE_ADDR: 127.0.0.1
      QUERY_DEFAULTS_LIMIT: 25
    ports: ["${WEAVIATE_HOST_HTTP_PORT:-8095}:8080", "${WEAVIATE_HOST_GRPC_PORT:-50055}:50051"]
    volumes:
      - weaviatedata:/var/lib/weaviate
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/v1/.well-known/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      # Container-network addresses override the localhost defaults in .env.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fira}:${POSTGRES_PASSWORD:-fira}@postgres:5432/${POSTGRES_DB:-fira}
      WEAVIATE_HTTP_HOST: weaviate
      WEAVIATE_HTTP_PORT: 8080
      WEAVIATE_GRPC_HOST: weaviate
      WEAVIATE_GRPC_PORT: 50051
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      weaviate: { condition: service_healthy }

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  weaviatedata:
